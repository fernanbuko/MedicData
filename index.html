function diasDesde(timestamp) {
  if (!timestamp) return Infinity;
  const fecha = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  return Math.floor((Date.now() - fecha.getTime()) / (1000 * 60 * 60 * 24));
}

function PanelAdminView() {
  const [cuentas, setCuentas] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [colaboradoresPorDueno, setColaboradoresPorDueno] = React.useState({});

  React.useEffect(() => {
    const unsub = db
      .collection("cuentasRegistradas")
      .orderBy("creadoEn", "desc")
      .onSnapshot(
        (snap) => {
          setCuentas(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          setLoading(false);
        },
        (err) => {
          console.error("Error leyendo cuentasRegistradas:", err);
          setLoading(false);
        }
      );
    return () => unsub();
  }, []);

  // Los/las colaboradores/as no tienen su propia fila en "cuentasRegistradas"
  // (esa colección es solo de consultorios) — se buscan aparte, por cada
  // consultorio, para poder mostrarlos agrupados debajo de su dueño/a.
  const idsCuentas = cuentas.map((c) => c.id).join(",");
  React.useEffect(() => {
    if (cuentas.length === 0) {
      setColaboradoresPorDueno({});
      return;
    }
    let cancelado = false;
    (async () => {
      const entradas = await Promise.all(
        cuentas.map(async (c) => {
          try {
            const snap = await db.collection("users").doc(c.id).collection("colaboradores").get();
            return [c.id, snap.docs.map((d) => ({ id: d.id, ...d.data() }))];
          } catch (e) {
            console.error(`Error leyendo colaboradores de ${c.id}:`, e);
            return [c.id, []];
          }
        })
      );
      if (!cancelado) setColaboradoresPorDueno(Object.fromEntries(entradas));
    })();
    return () => {
      cancelado = true;
    };
  }, [idsCuentas]);

  const totalColaboradores = Object.values(colaboradoresPorDueno).reduce((n, lista) => n + lista.length, 0);

  async function alternarBloqueo(cuenta) {
    if (cuenta.bloqueada) {
      const confirmado = await pedirConfirmacion(`¿Desbloquear "${cuenta.nombreConsultorio}"? Va a poder volver a entrar a MedicData.`, { textoConfirmar: "Desbloquear" });
      if (!confirmado) return;
      await db.collection("cuentasRegistradas").doc(cuenta.id).set({ bloqueada: false, motivoBloqueo: "" }, { merge: true });
    } else {
      const motivo = await pedirTexto(`¿Por qué vas a bloquear "${cuenta.nombreConsultorio}"? (se le va a mostrar este motivo)`, {
        textoConfirmar: "Bloquear",
        peligro: true,
        placeholder: "Motivo",
      });
      if (motivo === null) return;
      await db.collection("cuentasRegistradas").doc(cuenta.id).set({ bloqueada: true, motivoBloqueo: motivo || "" }, { merge: true });
    }
  }

  return (
    <div>
      <h1 className="text-2xl font-display font-semibold mb-1">Panel de administración</h1>
      <p className="text-muted text-sm mb-5">
        {cuentas.length} consultorio{cuentas.length === 1 ? "" : "s"} registrado{cuentas.length === 1 ? "" : "s"} en MedicData
        {totalColaboradores > 0 && `, ${totalColaboradores} colaborador${totalColaboradores === 1 ? "" : "es"} en total`}.
      </p>

      {loading ? (
        <Spinner />
      ) : cuentas.length === 0 ? (
        <EmptyState icon="🛠" title="Todavía no hay cuentas registradas" />
      ) : (
        <div className="space-y-4">
          {cuentas.map((c) => {
            const dias = diasDesde(c.ultimaConexion);
            const inactivaLargo = dias >= 30;
            const colaboradores = colaboradoresPorDueno[c.id] || [];
            return (
              <div key={c.id}>
                <Card className="flex items-center gap-3 flex-wrap">
                  <Badge color="#2E86D9">Dueño/a</Badge>
                  <div className="flex-1 min-w-[180px]">
                    <div className="font-medium">{c.nombreConsultorio || "(sin nombre)"}</div>
                    <div className="text-xs text-muted">{c.nombreMedico} {c.email ? `· ${c.email}` : ""}</div>
                  </div>
                  <div className="text-xs text-muted min-w-[110px]">
                    <div>Registrado: {c.creadoEn ? tiempoRelativo(c.creadoEn) : "—"}</div>
                    <div className={inactivaLargo ? "text-warn font-medium" : ""}>
                      Última vez: {c.ultimaConexion ? tiempoRelativo(c.ultimaConexion) : "—"}
                      {inactivaLargo && " ⚠"}
                    </div>
                  </div>
                  <Badge color={c.bloqueada ? "#B14E1C" : "#2F7A4F"}>{c.bloqueada ? "Bloqueada" : "Activa"}</Badge>
                  <SecondaryButton className="!px-3 !py-1.5 !text-xs" onClick={() => alternarBloqueo(c)}>
                    {c.bloqueada ? "Desbloquear" : "Bloquear"}
                  </SecondaryButton>
                </Card>
                {colaboradores.length > 0 && (
                  <div className="ml-4 sm:ml-8 mt-1.5 space-y-1.5 border-l-2 border-line dark:border-white/10 pl-3">
                    {colaboradores.map((colab) => (
                      <Card key={colab.id} className="flex items-center gap-3 flex-wrap !py-2.5">
                        <Badge color="#5B6B8C">Colaborador/a</Badge>
                        <div className="flex-1 min-w-[160px]">
                          <div className="font-medium text-sm">{colab.nombre || "(sin nombre)"}</div>
                          <div className="text-xs text-muted">{colab.email}</div>
                        </div>
                        <div className="text-xs text-muted">
                          {(colab.secciones || []).length > 0 ? `Ve: ${colab.secciones.join(", ")}` : "Sin secciones asignadas"}
                        </div>
                      </Card>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

  const [oscuro, setOscuro] = React.useState(() => {
    try {
      return localStorage.getItem("medidata:darkMode") === "1";
    } catch (e) {
      return false;
    }
  });
  const [view, setView] = React.useState("inicio");
  const [patientIdAbierto, setPatientIdAbierto] = React.useState(null);

  React.useEffect(() => {
    document.documentElement.classList.toggle("dark", oscuro);
    try {
      localStorage.setItem("medidata:darkMode", oscuro ? "1" : "0");
    } catch (e) {}
  }, [oscuro]);

  React.useEffect(() => {
    if (!firebaseReady) {
      setUser(null);
      return;
    }
    const unsub = auth.onAuthStateChanged((u) => setUser(u));
    return () => unsub();
  }, []);

  React.useEffect(() => {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("No se pudo registrar el Service Worker:", e));
    }
  }, []);

  const [versionOnboarding, setVersionOnboarding] = React.useState(0);
  const dataOwnerEstado = useDataOwner(user, versionOnboarding);
  const { config, loading: cargandoConfig } = useConfigConsultorio();

  const [colaboradorSecciones, setColaboradorSecciones] = React.useState(null);
  React.useEffect(() => {
    if (!dataOwnerEstado.esColaborador || !user) {
      setColaboradorSecciones(null);
      return;
    }
    const unsub = db
      .collection("users")
      .doc(dataOwnerEstado.ownerUid)
      .collection("colaboradores")
      .doc(user.uid)
      .onSnapshot((doc) => setColaboradorSecciones(doc.exists ? doc.data().secciones || [] : []));
    return () => unsub();
  }, [dataOwnerEstado.esColaborador, dataOwnerEstado.ownerUid, user && user.uid]);

  const esAdminApp = !!(user && user.email === ADMIN_EMAIL);

  // Estado de bloqueo del consultorio (ver PanelAdminView): vive en la
  // cuenta DUEÑA, así que un/a colaborador/a también queda bloqueado/a
  // cuando se bloquea el consultorio al que pertenece.
  const [cuentaEstado, setCuentaEstado] = React.useState({ cargando: true, existe: false, bloqueada: false, motivoBloqueo: "" });
  React.useEffect(() => {
    if (!dataOwnerEstado.ownerUid) return;
    const unsub = db
      .collection("cuentasRegistradas")
      .doc(dataOwnerEstado.ownerUid)
      .onSnapshot(
        (doc) => setCuentaEstado({ cargando: false, existe: doc.exists, bloqueada: doc.exists ? !!doc.data().bloqueada : false, motivoBloqueo: doc.exists ? doc.data().motivoBloqueo || "" : "" }),
        () => setCuentaEstado({ cargando: false, existe: false, bloqueada: false, motivoBloqueo: "" })
      );
    return () => unsub();
  }, [dataOwnerEstado.ownerUid]);

  // Deja registro de "última conexión" para el panel de administración —
  // solo desde la cuenta dueña, para no necesitar que los colaboradores
  // también tengan permiso de escritura ahí. Si la cuenta es de antes de
  // que existiera este panel (o si por lo que sea nunca quedó registrada
  // al crearse), se registra sola aquí — así el robot de recordatorios
  // también la encuentra.
  React.useEffect(() => {
    if (!dataOwnerEstado.ownerUid || dataOwnerEstado.esColaborador || dataOwnerEstado.necesitaOnboarding) return;
    if (cuentaEstado.cargando || cargandoConfig) return;
    if (cuentaEstado.existe) {
      db.collection("cuentasRegistradas").doc(dataOwnerEstado.ownerUid).set(
        { ultimaConexion: firebase.firestore.FieldValue.serverTimestamp() },
        { merge: true }
      ).catch(() => {});
    } else {
      registrarCuentaNueva(dataOwnerEstado.ownerUid, {
        nombreConsultorio: config.nombreConsultorio || "",
        nombreMedico: config.nombreMedico || "",
        email: (user && user.email) || "",
      });
    }
  }, [
    dataOwnerEstado.ownerUid,
    dataOwnerEstado.esColaborador,
    dataOwnerEstado.necesitaOnboarding,
    cuentaEstado.cargando,
    cuentaEstado.existe,
    cargandoConfig,
  ]);

  if (!firebaseReady) return <BootWarning />;
  if (user === undefined || dataOwnerEstado.cargando) {
    return <div className="min-h-screen flex items-center justify-center"><Spinner label="Cargando MedicData…" /></div>;
  }
  if (!user) return <LoginScreen />;
  if (dataOwnerEstado.necesitaOnboarding) {
    return <OnboardingGoogle user={user} onListo={() => setVersionOnboarding((n) => n + 1)} />;
  }
  if (dataOwnerEstado.esColaborador && colaboradorSecciones === null) {
    return <div className="min-h-screen flex items-center justify-center"><Spinner label="Cargando tu equipo…" /></div>;
  }
  if (cuentaEstado.cargando) {
    return <div className="min-h-screen flex items-center justify-center"><Spinner label="Cargando MedicData…" /></div>;
  }
  if (cuentaEstado.bloqueada && !esAdminApp) {
    return <CuentaBloqueadaScreen motivo={cuentaEstado.motivoBloqueo} onLogout={() => auth.signOut()} />;
  }

  const seccionesVisibles = dataOwnerEstado.esColaborador
    ? Array.from(new Set([...(colaboradorSecciones || []), "inicio", "config"]))
    : TODAS_LAS_SECCIONES.map((s) => s.key);

  function irAAgenda() {
    setView("agenda");
    setPatientIdAbierto(null);
  }

  function abrirVista(v) {
    setPatientIdAbierto(null);
    setView(v);
  }

  return (
    <>
    <GlobalDialogHost />
    <Layout
      view={view}
      setView={abrirVista}
      seccionesVisibles={seccionesVisibles}
      onLogout={() => auth.signOut()}
      config={cargandoConfig ? {} : config}
      esColaborador={dataOwnerEstado.esColaborador}
      esAdminApp={esAdminApp}
      oscuro={oscuro}
      setOscuro={setOscuro}
    >
      {view === "inicio" && (
        <InicioView config={config} setView={abrirVista} onAbrirPaciente={setPatientIdAbierto} />
      )}
      {view === "agenda" && seccionesVisibles.includes("agenda") && <AgendaView />}
      {view === "pacientes" && seccionesVisibles.includes("pacientes") && (
        patientIdAbierto ? (
          <PatientDetail patientId={patientIdAbierto} onVolver={() => setPatientIdAbierto(null)} config={config} />
        ) : (
          <PacientesView onAbrirPaciente={setPatientIdAbierto} />
        )
      )}
      {view === "recetas" && seccionesVisibles.includes("recetas") && <RecetasView config={config} />}
      {view === "examenes" && seccionesVisibles.includes("examenes") && <ExamenesView />}
      {view === "config" && (
        <ConfigView config={config} esColaborador={dataOwnerEstado.esColaborador} perfilColaborador={dataOwnerEstado.perfilColaborador} user={user} />
      )}
      {view === "panel" && esAdminApp && <PanelAdminView />}
      {!seccionesVisibles.includes(view) && view !== "panel" && (
        <EmptyState icon="🔒" title="No tienes acceso a esta sección" hint="Pídele al consultorio que te habilite esta sección desde Configuración." />
      )}
    </Layout>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
