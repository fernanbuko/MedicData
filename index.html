<!-- Si algo falla al cargar (script bloqueado, error de sintaxis, etc.),
     esto lo muestra en pantalla en vez de dejar "Cargando…" pegado para
     siempre sin explicación. -->
<script>
  (function () {
    function mostrarError(msg) {
      var el = document.getElementById("boot-msg");
      if (!el) return;
      el.innerHTML =
        '<strong>No se pudo cargar MedicData.</strong><br><br>' +
        '<span style="font-family:monospace;font-size:13px;color:#B14E1C">' + msg + '</span><br><br>' +
        '<button onclick="location.reload()" style="padding:8px 16px;border-radius:8px;background:#1F3A5F;color:#fff;border:none;font-size:14px">Reintentar</button>';
    }
    window.addEventListener(
      "error",
      function (e) {
        var origen = e && e.target && (e.target.src || e.target.href);
        if (origen) {
          mostrarError("No se pudo descargar: " + origen);
        } else {
          var detalle = (e && e.message) || "Error desconocido";
          if (e && e.filename) {
            detalle += "<br>Archivo: " + e.filename + (e.lineno ? " (línea " + e.lineno + ")" : "");
          }
          mostrarError(detalle);
        }
      },
      true // fase de captura: necesario para detectar scripts/estilos que no cargan
    );
    window.addEventListener("unhandledrejection", function (e) {
      var reason = e && e.reason;
      mostrarError((reason && (reason.message || reason)) || "Promesa rechazada sin mensaje");
    });
    setTimeout(function () {
      var root = document.getElementById("root");
      if (root && root.children.length === 1 && document.getElementById("boot-msg")) {
        mostrarError(
          "La app tardó demasiado en cargar. Puede ser tu conexión (intenta con WiFi), " +
          "o que algún recurso externo (React, Firebase, Tailwind) no haya podido descargarse."
        );
      }
    }, 12000);
  })();
</script>

function withTimeout(promise, ms = 15000) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("tiempo de espera agotado")), ms)),

}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function formatFecha(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  if (!y) return iso;
  const dt = new Date(y, (m || 1) - 1, d || 1);
  return dt.toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
}

function formatFechaHora(iso, hora) {
  return hora ? `${formatFecha(iso)}, ${hora}` : formatFecha(iso);
}

function tiempoRelativo(timestamp) {
  if (!timestamp) return "";
  const fecha = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  const segundos = Math.round((Date.now() - fecha.getTime()) / 1000);
  if (segundos < 60) return "hace un momento";
  const minutos = Math.round(segundos / 60);
  if (minutos < 60) return `hace ${minutos} min`;
  const horas = Math.round(minutos / 60);
  if (horas < 24) return `hace ${horas} h`;
  const dias = Math.round(horas / 24);
  if (dias < 7) return `hace ${dias} d`;
  return formatFecha(`${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, "0")}-${String(fecha.getDate()).padStart(2, "0")}`);
}

function calcularEdad(fechaNacimiento) {
  if (!fechaNacimiento) return null;
  const [y, m, d] = fechaNacimiento.split("-").map(Number);
  if (!y) return null;
  const hoy = new Date();
  let edad = hoy.getFullYear() - y;
  const cumpleEsteAnio = new Date(hoy.getFullYear(), m - 1, d);
  if (hoy < cumpleEsteAnio) edad--;
  return edad;
}

function calcularIMC(pesoKg, tallaCm) {
  const peso = parseFloat(pesoKg);
  const talla = parseFloat(tallaCm);
  if (!peso || !talla) return null;
  const tallaM = talla / 100;
  const imc = peso / (tallaM * tallaM);
  return Math.round(imc * 10) / 10;
}

function claseIMC(imc) {
  if (imc == null) return "";
  if (imc < 18.5) return "Bajo peso";
  if (imc < 25) return "Normal";
  if (imc < 30) return "Sobrepeso";
  return "Obesidad";
}

// Capa de datos: multi-consultorio simple.
// Un colaborador (secretaria, enfermera, médico asociado) ve y edita los
// mismos datos que el/la dueño/a de la cuenta a la que fue invitado/a.
// Esto se resuelve una sola vez al iniciar sesión (ver AuthGate) y se
// guarda en `window.__dataOwnerUid`.
// -----------------------------------------------------------------------
function coll(name) {
  const ownerUid = window.__dataOwnerUid;
  if (!ownerUid) throw new Error("Aún no se sabe de quién son los datos (dataOwnerUid vacío).");
  return db.collection("users").doc(ownerUid).collection(name);
}

function useCollection(name, { orderByField, direction = "asc", enabled = true } = {}) {
  const [items, setItems] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  React.useEffect(() => {
    if (!enabled || !firebaseReady || !window.__dataOwnerUid) {
      setLoading(false);
      return;
    }
    setLoading(true);
    let ref = coll(name);
    if (orderByField) ref = ref.orderBy(orderByField, direction);
    const unsub = ref.onSnapshot(
      (snap) => {
        setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        setLoading(false);
      },
      (err) => {
        console.error(`Error leyendo ${name}:`, err);
        setLoading(false);
      }
    );
    return () => unsub();
  }, [name, orderByField, direction, enabled, window.__dataOwnerUid]);
  return { items, loading };
}

async function crearDoc(name, data) {
  const ref = coll(name).doc();
  const payload = { ...data, creadoEn: firebase.firestore.FieldValue.serverTimestamp() };
  await withTimeout(ref.set(payload));
  return ref.id;
}
async function actualizarDoc(name, id, data) {
  await withTimeout(coll(name).doc(id).set({ ...data, actualizadoEn: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }));
}
async function borrarDoc(name, id) {
  await withTimeout(coll(name).doc(id).delete());
}

// Cloudinary: subida de fotos y archivos (sin backend propio), organizada

function sanitizarNombreCarpeta(nombre) {
  return (nombre || "sin_nombre")
    .normalize("NFD").replace(/[̀-ͯ]/g, "") // quita tildes
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "")
    .slice(0, 40) || "sin_nombre";
}

function carpetaConsultorio() {
  const uid = window.__dataOwnerUid || "sin_cuenta";
  return `medicdata/${uid}`;
}

function carpetaPaciente(patientFolderId, nombrePaciente) {
  return `${carpetaConsultorio()}/pacientes/${patientFolderId}_${sanitizarNombreCarpeta(nombrePaciente)}`;
}

async function subirACloudinary(file, folder) {
  if (!cloudinaryReady) throw new Error("Cloudinary no está configurado todavía.");
  const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
  const fd = new FormData();
  fd.append("file", file);
  fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  if (folder) fd.append("folder", folder);
  const res = await fetch(url, { method: "POST", body: fd });
  if (!res.ok) throw new Error("No se pudo subir el archivo.");
  const data = await res.json();
  return data.secure_url;
}

// -----------------------------------------------------------------------
// Reemplazo de confirm()/prompt() del navegador (que muestran la URL del
// sitio, "fernanbuko.github.io dice…", y no se pueden ver bien) por un
// diálogo propio de la app. Un solo componente montado una vez en la raíz
// (ver <GlobalDialogHost /> en App), y dos funciones que cualquier parte
// del código puede llamar como si fueran confirm()/prompt(), pero
// asíncronas: `if (await pedirConfirmacion("¿Seguro?")) { ... }`.
// -----------------------------------------------------------------------
let _resolverDialogoGlobal = null;

function pedirConfirmacion(mensaje, opciones = {}) {
  return new Promise((resolve) => {
    _resolverDialogoGlobal = resolve;
    if (window.__mostrarDialogoGlobal) {
      window.__mostrarDialogoGlobal({ tipo: "confirm", mensaje, ...opciones });
    } else {
      resolve(confirm(mensaje));
    }
  });
}

function pedirTexto(mensaje, opciones = {}) {
  return new Promise((resolve) => {
    _resolverDialogoGlobal = resolve;
    if (window.__mostrarDialogoGlobal) {
      window.__mostrarDialogoGlobal({ tipo: "prompt", mensaje, ...opciones });
    } else {
      resolve(prompt(mensaje));
    }
  });
}

function GlobalDialogHost() {
  const [estado, setEstado] = React.useState(null);
  const [valorTexto, setValorTexto] = React.useState("");

  React.useEffect(() => {
    window.__mostrarDialogoGlobal = (config) => {
      setValorTexto(config.valorInicial || "");
      setEstado(config);
    };
    return () => {
      window.__mostrarDialogoGlobal = null;
    };
  }, []);

  if (!estado) return null;

  function cerrar(resultado) {
    setEstado(null);
    if (_resolverDialogoGlobal) {
      _resolverDialogoGlobal(resultado);
      _resolverDialogoGlobal = null;
    }
  }

  const esPrompt = estado.tipo === "prompt";

  return (
    <div className="fixed inset-0 z-[60] bg-black/40 flex items-center justify-center p-4" onClick={() => cerrar(esPrompt ? null : false)}>
      <div className="bg-card dark:bg-[#0F1B2C] rounded-xl shadow-lg w-full max-w-sm p-5" onClick={(e) => e.stopPropagation()}>
        <p className="text-sm whitespace-pre-wrap">{estado.mensaje}</p>

// -----------------------------------------------------------------------
// Editor de foto: arrastrar para mover, control para hacer zoom, antes de
// subir logo/foto de perfil/foto de paciente — para poder encuadrarla bien
// en vez de subir la foto tal cual salió de la cámara.
// -----------------------------------------------------------------------
const AJUSTAR_FOTO_MARCO = 260;
const AJUSTAR_FOTO_SALIDA = 480;

function AjustarFotoModal({ file, redondo, onCancelar, onListo }) {
  const [imagen, setImagen] = React.useState(null);
  const [zoom, setZoom] = React.useState(1);
  const [offset, setOffset] = React.useState({ x: 0, y: 0 });
  const [guardando, setGuardando] = React.useState(false);
  const arrastre = React.useRef(null);

  React.useEffect(() => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => setImagen(img);
    img.src = url;
    return () => URL.revokeObjectURL(url);
  }, [file]);

  if (!imagen) {
    return (
      <Modal title="Ajustar foto" onClose={onCancelar}>
        <Spinner />
      </Modal>
    );
  }

  const marco = AJUSTAR_FOTO_MARCO;
  const escalaBase = Math.max(marco / imagen.width, marco / imagen.height);
  const escala = escalaBase * zoom;
  const anchoImg = imagen.width * escala;
  const altoImg = imagen.height * escala;
  const limiteX = Math.max(0, (anchoImg - marco) / 2);
  const limiteY = Math.max(0, (altoImg - marco) / 2);
  const offX = Math.min(limiteX, Math.max(-limiteX, offset.x));
  const offY = Math.min(limiteY, Math.max(-limiteY, offset.y));
  const left = (marco - anchoImg) / 2 + offX;
  const top = (marco - altoImg) / 2 + offY;

  function onPointerDown(e) {
    arrastre.current = { startX: e.clientX, startY: e.clientY, origX: offX, origY: offY };
    e.currentTarget.setPointerCapture(e.pointerId);
  }
  function onPointerMove(e) {
    if (!arrastre.current) return;
    setOffset({
      x: arrastre.current.origX + (e.clientX - arrastre.current.startX),
      y: arrastre.current.origY + (e.clientY - arrastre.current.startY),
    });
  }
  function onPointerUp() {
    arrastre.current = null;
  }

  function guardar() {
    setGuardando(true);
    const sx = -left / escala;
    const sy = -top / escala;
    const sw = marco / escala;
    const sh = marco / escala;
    const canvas = document.createElement("canvas");
    canvas.width = AJUSTAR_FOTO_SALIDA;
    canvas.height = AJUSTAR_FOTO_SALIDA;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(imagen, sx, sy, sw, sh, 0, 0, AJUSTAR_FOTO_SALIDA, AJUSTAR_FOTO_SALIDA);
    canvas.toBlob(
      (blob) => {
        setGuardando(false);
        if (blob) onListo(blob);
        else onCancelar();
      },
      "image/jpeg",
      0.9
    );
  }

  return (
    <Modal title="Ajustar foto" onClose={onCancelar}>
      <p className="text-xs text-muted mb-3">Arrastra la foto para moverla, y usa el control para acercar o alejar.</p>
      <div className="flex justify-center mb-4">
        <div
          onPointerDown={onPointerDown}
          onPointerMove={onPointerMove}
          onPointerUp={onPointerUp}
          onPointerLeave={onPointerUp}
          style={{ width: marco, height: marco, borderRadius: redondo ? "9999px" : "0.75rem", touchAction: "none" }}
          className="relative overflow-hidden bg-line dark:bg-white/10 cursor-grab active:cursor-grabbing select-none border border-line dark:border-white/15"
        >
          <img
            src={imagen.src}
            draggable={false}
            style={{ position: "absolute", left, top, width: anchoImg, height: altoImg, maxWidth: "none" }}
          />
        </div>
      </div>
      <Field label="Zoom">
        <input
          type="range"
          min="1"
          max="3"
          step="0.01"
          value={zoom}
          onChange={(e) => setZoom(Number(e.target.value))}
          className="w-full accent-accent2"
        />
      </Field>
      <div className="flex gap-2 justify-end mt-2">
        <SecondaryButton onClick={onCancelar}>Cancelar</SecondaryButton>
        <PrimaryButton onClick={guardar} disabled={guardando}>{guardando ? "Guardando…" : "Usar esta foto"}</PrimaryButton>
      </div>
    </Modal>
  );
}

// Autenticación: iniciar sesión, crear cuenta de consultorio, o unirse
// como colaborador/a (secretaria, enfermera, médico asociado) con un
// código de invitación que genera el/la dueño/a de la cuenta.
// -----------------------------------------------------------------------
function generarCodigoInvitacion() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < 7; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

// Registra este consultorio nuevo en el panel de administración (ver
// PanelAdminView), para que quien administra MediData pueda verlo en la
// lista. No afecta en nada el resto de la cuenta si nadie mira ese panel.
async function registrarCuentaNueva(uid, { nombreConsultorio, nombreMedico, email }) {
  try {
    await withTimeout(
      db.collection("cuentasRegistradas").doc(uid).set({
        nombreConsultorio,
        nombreMedico,
        email: email || "",
        creadoEn: firebase.firestore.FieldValue.serverTimestamp(),
        ultimaConexion: firebase.firestore.FieldValue.serverTimestamp(),
        bloqueada: false,
      })
    );
  } catch (e) {
    // No bloquea la creación de la cuenta si esto falla por algún motivo.
    console.error("No se pudo registrar la cuenta en el panel de administración:", e);
  }
}

function traducirErrorAuth(err) {
  const code = err && err.code;
  const mapa = {
    "auth/invalid-email": "Ese correo no es válido.",
    "auth/user-not-found": "No existe una cuenta con ese correo.",
    "auth/wrong-password": "Contraseña incorrecta.",
    "auth/invalid-credential": "Correo o contraseña incorrectos.",
    "auth/email-already-in-use": "Ya existe una cuenta con ese correo.",
    "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
    "auth/network-request-failed": "Problema de conexión. Intenta de nuevo.",
  };
  return mapa[code] || (err && err.message) || "Ocurrió un error inesperado.";
}

// Resuelve, después de iniciar sesión, de QUIÉN son los datos que hay que
// mostrar: si esta cuenta es dueña de un consultorio, son los suyos; si es
// colaborador/a, son los de la persona que la invitó.
function useDataOwner(user, versionOnboarding) {
  const [estado, setEstado] = React.useState({
    cargando: true,
    ownerUid: null,
    esColaborador: false,
    perfilColaborador: null,
    necesitaOnboarding: false,
  });

  React.useEffect(() => {
    if (!user) {
      setEstado({ cargando: false, ownerUid: null, esColaborador: false, perfilColaborador: null, necesitaOnboarding: false });
      window.__dataOwnerUid = null;
      return;
    }
    let cancelado = false;
    (async () => {
      try {
        const metaDoc = await withTimeout(db.collection("users").doc(user.uid).collection("meta").doc("perfil").get());
        if (cancelado) return;
        if (metaDoc.exists && metaDoc.data().duenoUid) {
          const ownerUid = metaDoc.data().duenoUid;
          window.__dataOwnerUid = ownerUid;
          setEstado({ cargando: false, ownerUid, esColaborador: true, perfilColaborador: metaDoc.data(), necesitaOnboarding: false });
          return;
        }
        // Ni "meta/perfil" (no es colaborador/a) ni, si llegamos aquí,
        // sabemos todavía si ya tiene su propio consultorio creado. Esto
        // solo puede pasar recién llegando con Google (con correo y
        // contraseña, "config" se crea en el mismo paso del registro) —
        // así que revisamos si ya existe su "config" antes de asumir que
        // es dueño/a de algo.
        const configDoc = await withTimeout(db.collection("users").doc(user.uid).collection("data").doc("config").get());
        if (cancelado) return;
        if (!configDoc.exists) {
          window.__dataOwnerUid = null;
          setEstado({ cargando: false, ownerUid: null, esColaborador: false, perfilColaborador: null, necesitaOnboarding: true });
          return;
        }
        window.__dataOwnerUid = user.uid;
        setEstado({ cargando: false, ownerUid: user.uid, esColaborador: false, perfilColaborador: null, necesitaOnboarding: false });
      } catch (e) {
        console.error("Error resolviendo dueño de los datos:", e);
        window.__dataOwnerUid = user.uid;
        setEstado({ cargando: false, ownerUid: user.uid, esColaborador: false, perfilColaborador: null, necesitaOnboarding: false });
      }
    })();
    return () => { cancelado = true; };
  }, [user && user.uid, versionOnboarding]);

  return estado;
}

// Pantalla que ve, una sola vez, quien entra por primera vez con Google:
// como no hay un formulario previo al inicio de sesión (a diferencia de
// correo/contraseña), aquí se le pregunta si va a crear su propio
// consultorio o si se está uniendo a uno con un código de invitación.
function OnboardingGoogle({ user, onListo }) {
  const [modo, setModo] = React.useState(null); // null | crear | colaborador
  const [nombreConsultorio, setNombreConsultorio] = React.useState("");
  const [nombreMedico, setNombreMedico] = React.useState(user.displayName || "");
  const [codigoInvitacion, setCodigoInvitacion] = React.useState("");
  const [nombreColaborador, setNombreColaborador] = React.useState(user.displayName || "");
  const [guardando, setGuardando] = React.useState(false);
  const [error, setError] = React.useState("");

  async function crearConsultorio(e) {
    e.preventDefault();
    if (!nombreConsultorio.trim() || !nombreMedico.trim()) {
      setError("Completa el nombre del consultorio y tu nombre.");
      return;
    }
    setGuardando(true);
    setError("");
    try {
      const codigo = generarCodigoInvitacion();
      await withTimeout(
        db.collection("users").doc(user.uid).collection("data").doc("config").set({
          nombreConsultorio: nombreConsultorio.trim(),
          nombreMedico: nombreMedico.trim(),
          especialidad: "",
          telefono: "",
          direccion: "",
          inviteCode: codigo,
        })
      );
      await withTimeout(db.collection("inviteCodes").doc(codigo).set({ ownerUid: user.uid }));
      await registrarCuentaNueva(user.uid, { nombreConsultorio: nombreConsultorio.trim(), nombreMedico: nombreMedico.trim(), email: user.email || "" });
      onListo();
    } catch (err) {
      setError(err.message);
    }
    setGuardando(false);
  }

  async function unirseAEquipo(e) {
    e.preventDefault();
    const codigo = codigoInvitacion.trim().toUpperCase();
    if (!codigo || !nombreColaborador.trim()) {
      setError("Completa el código de invitación y tu nombre.");
      return;
    }
    setGuardando(true);
    setError("");
    try {
      const invDoc = await withTimeout(db.collection("inviteCodes").doc(codigo).get());
      if (!invDoc.exists) {
        setError("Ese código de invitación no existe. Pídele al consultorio que te lo confirme.");
        setGuardando(false);
        return;
      }
      const ownerUid = invDoc.data().ownerUid;
      await withTimeout(
        db.collection("users").doc(user.uid).collection("meta").doc("perfil").set({
          duenoUid: ownerUid,
          nombre: nombreColaborador.trim(),
          email: user.email || "",
        })
      );
      await withTimeout(
        db.collection("users").doc(ownerUid).collection("colaboradores").doc(user.uid).set({
          nombre: nombreColaborador.trim(),
          email: user.email || "",
          secciones: ["agenda", "pacientes"],
          creadoEn: firebase.firestore.FieldValue.serverTimestamp(),
        })
      );
      onListo();
    } catch (err) {
      setError(err.message);
    }
    setGuardando(false);
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4 py-10">
      <div className="w-full max-w-md">
        <div className="text-center mb-6">
          <h1 className="text-2xl font-display font-semibold">¡Hola, {user.displayName || user.email}!</h1>
          <p className="text-muted text-sm mt-1">Es la primera vez que entras. ¿Cómo vas a usar MedicData?</p>
        </div>

        {!modo && (
          <div className="flex flex-col gap-3">
            <PrimaryButton onClick={() => setModo("crear")} className="w-full justify-center">Voy a crear mi consultorio</PrimaryButton>
            <SecondaryButton onClick={() => setModo("colaborador")} className="w-full justify-center">Me invitaron con un código</SecondaryButton>
          </div>
        )}

        {modo === "crear" && (
          <Card>
            <form onSubmit={crearConsultorio}>
              <Field label="Nombre del consultorio"><TextInput required value={nombreConsultorio} onChange={(e) => setNombreConsultorio(e.target.value)} placeholder="Ej. Consultorio Dr. Pérez" /></Field>
              <Field label="Tu nombre"><TextInput required value={nombreMedico} onChange={(e) => setNombreMedico(e.target.value)} /></Field>
              {error && <p className="text-warn text-sm mb-3">{error}</p>}
              <div className="flex gap-2 justify-end">
                <SecondaryButton onClick={() => { setModo(null); setError(""); }}>Atrás</SecondaryButton>
                <PrimaryButton type="submit" disabled={guardando}>{guardando ? "Creando…" : "Crear mi consultorio"}</PrimaryButton>
              </div>
            </form>
          </Card>
        )}

        {modo === "colaborador" && (
          <Card>
            <form onSubmit={unirseAEquipo}>
              <Field label="Código de invitación"><TextInput required value={codigoInvitacion} onChange={(e) => setCodigoInvitacion(e.target.value.toUpperCase())} placeholder="Ej. AB3D9KX" /></Field>
              <Field label="Tu nombre"><TextInput required value={nombreColaborador} onChange={(e) => setNombreColaborador(e.target.value)} /></Field>
              {error && <p className="text-warn text-sm mb-3">{error}</p>}
              <div className="flex gap-2 justify-end">
                <SecondaryButton onClick={() => { setModo(null); setError(""); }}>Atrás</SecondaryButton>
                <PrimaryButton type="submit" disabled={guardando}>{guardando ? "Uniéndome…" : "Unirme al equipo"}</PrimaryButton>
              </div>
            </form>
          </Card>
        )}

        <button onClick={() => auth.signOut()} className="text-sm text-muted hover:text-warn mt-6 mx-auto block">Cerrar sesión</button>
      </div>
    </div>
  );
}

// Layout: navegación (barra lateral en escritorio, barra inferior en
// celular), filtrada según el rol de quien inició sesión.
// -----------------------------------------------------------------------
function useConfigConsultorio() {
  const [config, setConfig] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  React.useEffect(() => {
    if (!window.__dataOwnerUid) return;
    setLoading(true);
    const unsub = db
      .collection("users")
      .doc(window.__dataOwnerUid)
      .collection("data")
      .doc("config")
      .onSnapshot((doc) => {
        setConfig(doc.exists ? doc.data() : {});
        setLoading(false);
      });
    return () => unsub();
  }, [window.__dataOwnerUid]);
  return { config: config || {}, loading };
}

// -----------------------------------------------------------------------
// Campanita de notificaciones: lista dentro de la app (no solo el aviso
// push) de los avisos que va dejando el robot de recordatorios en
// users/{dueño}/notificaciones — citas próximas, controles atrasados, etc.
// -----------------------------------------------------------------------
function NotificationBell() {
  const { items: notificaciones } = useCollection("notificaciones", { orderByField: "creadoEn", direction: "desc" });
  const [abierta, setAbierta] = React.useState(false);
  const ref = React.useRef(null);

  React.useEffect(() => {
    function onClickFuera(e) {
      if (ref.current && !ref.current.contains(e.target)) setAbierta(false);
    }
    document.addEventListener("mousedown", onClickFuera);
    return () => document.removeEventListener("mousedown", onClickFuera);
  }, []);

  const noLeidas = notificaciones.filter((n) => !n.leida).length;
  const visibles = notificaciones.slice(0, 30);

  async function marcarLeida(n) {
    if (n.leida) return;
    try {
      await withTimeout(coll("notificaciones").doc(n.id).set({ leida: true }, { merge: true }));
    } catch (e) {
      console.error("Error actualizando notificación:", e);
    }
  }
  async function marcarTodasLeidas() {
    await Promise.all(
      notificaciones.filter((n) => !n.leida).map((n) => coll("notificaciones").doc(n.id).set({ leida: true }, { merge: true }).catch(() => {}))
    );
  }
  async function eliminarNotificacion(e, id) {
    e.stopPropagation();
    try {
      await withTimeout(coll("notificaciones").doc(id).delete());
    } catch (e2) {
      console.error("Error borrando notificación:", e2);
    }
  }

  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setAbierta((v) => !v)}
        className="relative w-8 h-8 rounded-full flex items-center justify-center hover:bg-line dark:hover:bg-white/10 text-lg"
        title="Notificaciones"
      >
        🔔
        {noLeidas > 0 && (
          <span className="absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-warn text-white text-[10px] leading-4 text-center font-semibold">
            {noLeidas > 9 ? "9+" : noLeidas}
          </span>
        )}
      </button>
      {abierta && (
        <div className="fixed left-3 right-3 top-16 max-h-[70vh] md:absolute md:left-auto md:right-0 md:top-full md:mt-2 md:w-80 md:max-w-[90vw] md:max-h-96 overflow-y-auto bg-card dark:bg-[#0F1B2C] border border-line dark:border-white/10 rounded-lg shadow-lg z-50">
          <div className="flex items-center justify-between px-3 py-2 border-b border-line dark:border-white/10">

function PatientForm({ paciente, onClose, onSaved }) {
  const [data, setData] = React.useState(
    paciente || {
      nombre: "",
      documentoTipo: "Cédula",
      documentoNumero: "",
      fechaNacimiento: "",
      sexo: "Femenino",
      telefono: "",
      email: "",
      direccion: "",
      contactoEmergenciaNombre: "",
      contactoEmergenciaTelefono: "",
      seguroMedico: "",
      alergias: "",
      antecedentes: "",
      foto: "",
    }
  );
  const [subiendoFoto, setSubiendoFoto] = React.useState(false);
  const [archivoParaAjustar, setArchivoParaAjustar] = React.useState(null);
  const [guardando, setGuardando] = React.useState(false);
  const [error, setError] = React.useState("");
  const set = (k) => (e) => setData((d) => ({ ...d, [k]: e.target.value }));
  // Id estable para la carpeta de Cloudinary de este paciente, aunque
  // todavía no se haya guardado (y por lo tanto no tenga id real en
  // Firestore) la primera vez que se sube su foto.
  const carpetaId = React.useRef(paciente?.id || uid()).current;

  function elegirFoto(e) {
    const file = e.target.files[0];
    e.target.value = "";
    if (file) setArchivoParaAjustar(file);
  }

  async function subirFotoAjustada(blob) {
    setArchivoParaAjustar(null);
    setSubiendoFoto(true);
    try {
      const url = await subirACloudinary(blob, carpetaPaciente(carpetaId, data.nombre));
      setData((d) => ({ ...d, foto: url }));
    } catch (err) {
      setError(err.message);
    }
    setSubiendoFoto(false);
  }

  async function guardar(e) {
    e.preventDefault();
    if (!data.nombre.trim()) {
      setError("El nombre es obligatorio.");
      return;
    }
    setGuardando(true);
    setError("");
    try {
      if (paciente && paciente.id) {
        await actualizarDoc("pacientes", paciente.id, data);
      } else {
        await crearDoc("pacientes", data);
      }
      onSaved();
    } catch (err) {
      setError(err.message);
    }
    setGuardando(false);
  }

  return (
    <Modal title={paciente ? "Editar paciente" : "Nuevo paciente"} onClose={onClose} wide>
      <form onSubmit={guardar}>
        <div className="flex items-center gap-4 mb-4">
          <div className="w-16 h-16 rounded-full bg-line dark:bg-white/10 overflow-hidden shrink-0 flex items-center justify-center text-muted">
            {data.foto ? <img src={data.foto} className="w-full h-full object-cover" /> : "🧑"}
          </div>
          <label className="text-sm text-accent2 cursor-pointer hover:underline">
            {subiendoFoto ? "Subiendo…" : "Subir foto"}
            <input type="file" accept="image/*" className="hidden" onChange={elegirFoto} disabled={subiendoFoto || !cloudinaryReady} />
          </label>
          {!cloudinaryReady && <span className="text-xs text-faint">(configura Cloudinary para poder subir fotos)</span>}
        </div>

        <div className="grid sm:grid-cols-2 gap-x-4">
          <Field label="Nombre completo"><TextInput required value={data.nombre} onChange={set("nombre")} /></Field>
          <Field label="Fecha de nacimiento"><TextInput type="date" value={data.fechaNacimiento} onChange={set("fechaNacimiento")} /></Field>
          <Field label="Tipo de documento">
            <Select value={data.documentoTipo} onChange={set("documentoTipo")}>
              {TIPOS_DOCUMENTO.map((t) => <option key={t}>{t}</option>)}
            </Select>
          </Field>
          <Field label="Número de documento"><TextInput value={data.documentoNumero} onChange={set("documentoNumero")} /></Field>
          <Field label="Sexo">
            <Select value={data.sexo} onChange={set("sexo")}>
              {OPCIONES_SEXO.map((s) => <option key={s}>{s}</option>)}
            </Select>
          </Field>
          <Field label="Teléfono"><TextInput value={data.telefono} onChange={set("telefono")} /></Field>
          <Field label="Correo"><TextInput type="email" value={data.email} onChange={set("email")} /></Field>
          <Field label="Seguro médico / EPS"><TextInput value={data.seguroMedico} onChange={set("seguroMedico")} /></Field>
        </div>
        <Field label="Dirección"><TextInput value={data.direccion} onChange={set("direccion")} /></Field>
        <div className="grid sm:grid-cols-2 gap-x-4">
          <Field label="Contacto de emergencia"><TextInput value={data.contactoEmergenciaNombre} onChange={set("contactoEmergenciaNombre")} /></Field>
          <Field label="Teléfono de emergencia"><TextInput value={data.contactoEmergenciaTelefono} onChange={set("contactoEmergenciaTelefono")} /></Field>
        </div>
        <Field label="Alergias"><TextArea rows={2} value={data.alergias} onChange={set("alergias")} placeholder="Ej. Penicilina, mariscos…" /></Field>
        <Field label="Antecedentes médicos"><TextArea rows={2} value={data.antecedentes} onChange={set("antecedentes")} placeholder="Enfermedades crónicas, cirugías previas, etc." /></Field>

        {error && <p className="text-warn text-sm mb-3">{error}</p>}
        <div className="flex gap-2 justify-end mt-2">
          <SecondaryButton onClick={onClose}>Cancelar</SecondaryButton>
          <PrimaryButton type="submit" disabled={guardando}>{guardando ? "Guardando…" : "Guardar"}</PrimaryButton>
        </div>
      </form>
      {archivoParaAjustar && (
        <AjustarFotoModal file={archivoParaAjustar} redondo onCancelar={() => setArchivoParaAjustar(null)} onListo={subirFotoAjustada} />
      )}
    </Modal>
  );
}

function PacientesView({ onAbrirPaciente }) {
  const { items: pacientes, loading } = useCollection("pacientes", { orderByField: "nombre" });
  const [busqueda, setBusqueda] = React.useState("");
  const [mostrarForm, setMostrarForm] = React.useState(false);

  const filtrados = pacientes.filter((p) => {
    const q = busqueda.trim().toLowerCase();
    if (!q) return true;
    return (p.nombre || "").toLowerCase().includes(q) || (p.documentoNumero || "").toLowerCase().includes(q) || (p.telefono || "").includes(q);
  });

  return (
    <div>
      <div className="flex items-center justify-between gap-3 mb-5 flex-wrap">
        <h1 className="text-2xl font-display font-semibold">Pacientes</h1>
        <PrimaryButton onClick={() => setMostrarForm(true)}>+ Nuevo paciente</PrimaryButton>
      </div>
      <div className="mb-4"><SearchInput value={busqueda} onChange={setBusqueda} placeholder="Buscar por nombre, documento o teléfono…" /></div>

      {loading ? (
        <Spinner />
      ) : filtrados.length === 0 ? (
        <EmptyState icon="🧑‍⚕️" title={pacientes.length ? "No hay resultados" : "Todavía no hay pacientes"} hint={pacientes.length ? "Prueba con otra búsqueda." : "Crea el primero con el botón de arriba."} />
      ) : (
        <div className="grid sm:grid-cols-2 gap-3">
          {filtrados.map((p) => {
            const edad = calcularEdad(p.fechaNacimiento);
            return (
              <button key={p.id} onClick={() => onAbrirPaciente(p.id)} className="text-left">
                <Card className="hover:border-accent hover:shadow-md transition flex items-center gap-3">
                  <div className="w-11 h-11 rounded-full bg-line dark:bg-white/10 overflow-hidden shrink-0 flex items-center justify-center text-muted">
                    {p.foto ? <img src={p.foto} className="w-full h-full object-cover" /> : "🧑"}
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="font-medium truncate">{p.nombre}</div>
                    <div className="text-xs text-muted truncate">
                      {edad != null ? `${edad} años` : ""}{edad != null && p.telefono ? " · " : ""}{p.telefono}
                    </div>
                  </div>
                </Card>
              </button>
            );
          })}
        </div>
      )}

      {mostrarForm && <PatientForm onClose={() => setMostrarForm(false)} onSaved={() => setMostrarForm(false)} />}
    </div>
  );
}

function fila(label, valor) {
  if (!valor) return "";
  return `<div style="margin-bottom:6px"><strong>${esc(label)}:</strong> ${esc(valor)}</div>`;
}

function imprimirFichaPaciente(paciente, consultas, recetas, examenes, config) {
  const historiaHtml = consultas
    .map(
      (c) => `
    <div style="margin:14px 0;padding:10px;border:1px solid #ddd;border-radius:6px">
      <div style="font-size:12px;color:#666">${esc(formatFechaHora(c.fecha, c.hora))}</div>
      ${fila("Motivo de consulta", c.motivoConsulta)}
      ${fila("Diagnóstico", c.diagnostico)}
      ${fila("Plan", c.plan)}
    </div>`
    )
    .join("");
  const win = window.open("", "_blank");
  win.document.write(`
    <html><head><title>Ficha - ${esc(paciente.nombre)}</title>
    <style>body{font-family:Arial,sans-serif;padding:24px;color:#1F3A5F;max-width:760px;margin:0 auto} h1{font-size:22px} h2{font-size:16px;margin-top:22px;border-bottom:1px solid #ddd;padding-bottom:4px}</style>
    </head><body>
      <h1>${esc(config.nombreConsultorio || "Consultorio médico")}</h1>
      <p style="color:#666">${esc(config.nombreMedico || "")} ${config.especialidad ? "· " + esc(config.especialidad) : ""}</p>
      <h2>Datos del paciente</h2>
      ${fila("Nombre", paciente.nombre)}
      ${fila("Documento", `${paciente.documentoTipo || ""} ${paciente.documentoNumero || ""}`)}
      ${fila("Fecha de nacimiento", formatFecha(paciente.fechaNacimiento))}
      ${fila("Sexo", paciente.sexo)}
      ${fila("Teléfono", paciente.telefono)}
      ${fila("Seguro médico", paciente.seguroMedico)}
      ${fila("Alergias", paciente.alergias)}
      ${fila("Antecedentes", paciente.antecedentes)}
      <h2>Historia clínica</h2>
      ${historiaHtml || "<p>Sin consultas registradas.</p>"}
    </body></html>
  `);
  win.document.close();
  win.print();
}

// Galería de fotos del paciente: varias fotos con fecha (a diferencia de
// la foto de perfil, que es solo una), útil para documentar evolución,
// heridas, resultados visuales, etc. Con visor a pantalla completa.
// -----------------------------------------------------------------------
function FotoForm({ paciente, onClose, onSaved }) {
  const [fecha, setFecha] = React.useState(hoyISO());
  const [nota, setNota] = React.useState("");
  const [url, setUrl] = React.useState("");
  const [subiendo, setSubiendo] = React.useState(false);
  const [guardando, setGuardando] = React.useState(false);
  const [error, setError] = React.useState("");

  async function subirFoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    setSubiendo(true);
    setError("");
    try {
      const subida = await subirACloudinary(file, `${carpetaPaciente(paciente.id, paciente.nombre)}/fotos`);
      setUrl(subida);
    } catch (err) {
      setError(err.message);
    }
    setSubiendo(false);
  }

  async function guardar(e) {
    e.preventDefault();
    if (!url) {
      setError("Primero sube una foto.");
      return;
    }
    setGuardando(true);
    setError("");
    try {
      await crearDoc("fotos", { patientId: paciente.id, patientName: paciente.nombre, fecha, nota, url });
      onSaved();
    } catch (err) {
      setError(err.message);
    }
    setGuardando(false);
  }

  return (
    <Modal title={`Nueva foto — ${paciente.nombre}`} onClose={onClose}>
      <form onSubmit={guardar}>
        <Field label="Foto">
          {url ? (
            <div className="relative w-32 h-32">
              <img src={url} className="w-full h-full object-cover rounded-lg" />
              <button type="button" onClick={() => setUrl("")} className="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-warn text-white text-xs">✕</button>
            </div>
          ) : (
            <label className="flex items-center justify-center w-32 h-32 rounded-lg border border-dashed border-faint dark:border-white/20 text-sm text-accent2 cursor-pointer">
              {subiendo ? "Subiendo…" : "+ Elegir foto"}
              <input type="file" accept="image/*" className="hidden" onChange={subirFoto} disabled={subiendo || !cloudinaryReady} />
            </label>
          )}
          {!cloudinaryReady && <span className="text-xs text-faint block mt-1">(configura Cloudinary para poder subir fotos)</span>}
        </Field>
        <Field label="Fecha"><TextInput type="date" required value={fecha} onChange={(e) => setFecha(e.target.value)} /></Field>
        <Field label="Nota (opcional)"><TextInput value={nota} onChange={(e) => setNota(e.target.value)} placeholder="Ej. Antes del tratamiento" /></Field>

        {error && <p className="text-warn text-sm mb-3">{error}</p>}
        <div className="flex gap-2 justify-end mt-2">
          <SecondaryButton onClick={onClose}>Cancelar</SecondaryButton>
          <PrimaryButton type="submit" disabled={guardando || !url}>{guardando ? "Guardando…" : "Guardar"}</PrimaryButton>
        </div>
      </form>
    </Modal>
  );
}

function GaleriaLightbox({ fotos, indiceInicial, onClose, onEliminar }) {
  const [indice, setIndice] = React.useState(indiceInicial);
  const foto = fotos[indice];

  React.useEffect(() => {
    function onTecla(e) {
      if (e.key === "Escape") onClose();
      if (e.key === "ArrowRight") setIndice((i) => Math.min(i + 1, fotos.length - 1));
      if (e.key === "ArrowLeft") setIndice((i) => Math.max(i - 1, 0));
    }
    document.addEventListener("keydown", onTecla);
    return () => document.removeEventListener("keydown", onTecla);
  }, [fotos.length, onClose]);

  if (!foto) return null;

  return (
    <div className="fixed inset-0 z-50 bg-black/90 flex flex-col" onClick={onClose}>
      <div className="flex items-center justify-between px-4 py-3 text-white text-sm shrink-0" onClick={(e) => e.stopPropagation()}>
        <span>{formatFecha(foto.fecha)} {foto.nota ? `· ${foto.nota}` : ""}</span>
        <div className="flex items-center gap-3">
          <span className="text-white/60">{indice + 1} / {fotos.length}</span>
          <button onClick={() => onEliminar(foto)} className="text-white/80 hover:text-warn">Eliminar</button>
          <button onClick={onClose} className="text-white/80 hover:text-white text-xl leading-none">×</button>
        </div>
      </div>
      <div className="flex-1 flex items-center justify-center relative min-h-0" onClick={(e) => e.stopPropagation()}>
        {indice > 0 && (
          <button onClick={() => setIndice((i) => i - 1)} className="absolute left-2 text-white/70 hover:text-white text-3xl px-3 py-6">‹</button>
        )}
        <img src={foto.url} className="max-w-full max-h-full object-contain" />
        {indice < fotos.length - 1 && (
          <button onClick={() => setIndice((i) => i + 1)} className="absolute right-2 text-white/70 hover:text-white text-3xl px-3 py-6">›</button>
        )}
      </div>
    </div>
  );
}

function FotosDePaciente({ paciente, fotos }) {
  const [mostrarForm, setMostrarForm] = React.useState(false);
  const [indiceAbierto, setIndiceAbierto] = React.useState(null);

  async function eliminarFoto(foto) {
    if (!(await pedirConfirmacion("¿Eliminar esta foto? No se puede deshacer.", { textoConfirmar: "Eliminar", peligro: true }))) return;
    await borrarDoc("fotos", foto.id);
    setIndiceAbierto(null);
  }

  return (
    <div>
      <div className="flex justify-end mb-3"><PrimaryButton onClick={() => setMostrarForm(true)}>+ Agregar foto</PrimaryButton></div>
      {fotos.length === 0 ? (
        <EmptyState icon="🖼" title="Sin fotos guardadas" />
      ) : (
        <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
          {fotos.map((f, i) => (
            <button key={f.id} onClick={() => setIndiceAbierto(i)} className="aspect-square rounded-lg overflow-hidden bg-line dark:bg-white/10">
              <img src={f.url} className="w-full h-full object-cover" />
            </button>
          ))}
        </div>
      )}
      {mostrarForm && <FotoForm paciente={paciente} onClose={() => setMostrarForm(false)} onSaved={() => setMostrarForm(false)} />}
      {indiceAbierto !== null && (
        <GaleriaLightbox fotos={fotos} indiceInicial={indiceAbierto} onClose={() => setIndiceAbierto(null)} onEliminar={eliminarFoto} />
      )}
    </div>
  );
}

function PatientDetail({ patientId, onVolver, config }) {
  const { items: pacientes } = useCollection("pacientes");
  const paciente = pacientes.find((p) => p.id === patientId);
  const { items: consultasTodas } = useCollection("consultas", { orderByField: "fecha", direction: "desc" });
  const { items: recetasTodas } = useCollection("recetas", { orderByField: "fecha", direction: "desc" });
  const { items: examenesTodos } = useCollection("examenes", { orderByField: "fecha", direction: "desc" });
  const { items: fotosTodas } = useCollection("fotos", { orderByField: "fecha", direction: "desc" });
  const [tab, setTab] = React.useState("historia");
  const [mostrarEditar, setMostrarEditar] = React.useState(false);
  const [mostrarConsulta, setMostrarConsulta] = React.useState(false);
  const [eliminando, setEliminando] = React.useState(false);

  if (!paciente) return <Spinner label="Cargando paciente…" />;

  const consultas = consultasTodas.filter((c) => c.patientId === patientId);
  const recetas = recetasTodas.filter((r) => r.patientId === patientId);
  const examenes = examenesTodos.filter((e) => e.patientId === patientId);
  const fotos = fotosTodas.filter((f) => f.patientId === patientId);
  const edad = calcularEdad(paciente.fechaNacimiento);

  const tabs = [
    ["historia", "Historia clínica"],
    ["recetas", "Recetas"],
    ["examenes", "Exámenes"],
    ["fotos", "Fotos"],
  ];

  async function eliminarPaciente() {
    const confirmado = await pedirConfirmacion(
      `¿Eliminar a ${paciente.nombre}? Se borra su ficha; las consultas, recetas y exámenes que ya tiene guardados quedan en el sistema pero ya no se van a poder ver desde su ficha. Esta acción no se puede deshacer.`,
      { textoConfirmar: "Eliminar", peligro: true }
    );
    if (!confirmado) return;
    setEliminando(true);
    try {
      await borrarDoc("pacientes", paciente.id);
      onVolver();
    } catch (err) {
      alert(err.message);
      setEliminando(false);
    }
  }

  return (
    <div>
      <button onClick={onVolver} className="text-sm text-muted hover:text-ink dark:hover:text-paper mb-4">← Volver a pacientes</button>

      <Card className="mb-5">
        <div className="flex items-start gap-4 flex-wrap">
          <div className="w-16 h-16 rounded-full bg-line dark:bg-white/10 overflow-hidden shrink-0 flex items-center justify-center text-muted text-2xl">
            {paciente.foto ? <img src={paciente.foto} className="w-full h-full object-cover" /> : "🧑"}
          </div>
          <div className="flex-1 min-w-[200px]">
            <h1 className="text-xl font-display font-semibold">{paciente.nombre}</h1>
            <div className="text-sm text-muted mt-0.5">
              {edad != null ? `${edad} años` : ""} {paciente.sexo ? `· ${paciente.sexo}` : ""} {paciente.documentoNumero ? `· ${paciente.documentoTipo} ${paciente.documentoNumero}` : ""}
            </div>
            <div className="text-sm text-muted mt-0.5">{paciente.telefono} {paciente.email ? `· ${paciente.email}` : ""}</div>
            {paciente.alergias && (
              <div className="mt-2 text-xs px-2 py-1 rounded-md bg-warnbg text-warn border border-warnborder inline-block">⚠ Alergias: {paciente.alergias}</div>
            )}
          </div>
          <div className="flex gap-2 items-start">
            <SecondaryButton onClick={() => setMostrarEditar(true)}>Editar</SecondaryButton>
            <SecondaryButton onClick={() => imprimirFichaPaciente(paciente, consultas, recetas, examenes, config)}>Imprimir ficha</SecondaryButton>
          </div>
        </div>
        <div className="mt-3 pt-3 border-t border-line dark:border-white/10 flex justify-end">
          <DangerLink onClick={eliminarPaciente}>{eliminando ? "Eliminando…" : "Eliminar paciente"}</DangerLink>
        </div>
      </Card>

      <div className="flex gap-1 mb-4 border-b border-line dark:border-white/10">

          <button key={k} onClick={() => setTab(k)} className={`px-3 py-2 text-sm font-medium border-b-2 -mb-px ${tab === k ? "border-ink dark:border-accent text-ink dark:text-accent" : "border-transparent text-muted"}`}>

          <div className="flex justify-end mb-3"><PrimaryButton onClick={() => setMostrarConsulta(true)}>+ Nueva consulta</PrimaryButton></div>

      {tab === "examenes" && <ExamenesDePaciente paciente={paciente} examenes={examenes} />}

// Consultas: cada visita queda registrada con signos vitales, motivo,
// examen físico, diagnóstico, plan y próximo control.
// -----------------------------------------------------------------------
function ConsultaForm({ paciente, citaId, onClose, onSaved }) {
  const [data, setData] = React.useState({
    fecha: hoyISO(),
    hora: new Date().toTimeString().slice(0, 5),
    motivoConsulta: "",
    sintomas: "",
    presionArterial: "",
    frecuenciaCardiaca: "",
    frecuenciaRespiratoria: "",
    temperatura: "",
    saturacionO2: "",
    peso: "",
    talla: "",
    examenFisico: "",
    diagnostico: "",
    plan: "",
    indicaciones: "",
    proximoControl: "",
  });
  const [guardando, setGuardando] = React.useState(false);
  const [error, setError] = React.useState("");
  const set = (k) => (e) => setData((d) => ({ ...d, [k]: e.target.value }));
  const imc = calcularIMC(data.peso, data.talla);

  async function guardar(e) {
    e.preventDefault();
    if (!data.motivoConsulta.trim()) {
      setError("El motivo de consulta es obligatorio.");
      return;
    }
    setGuardando(true);
    setError("");
    try {
      await crearDoc("consultas", {
        ...data,
        patientId: paciente.id,
        patientName: paciente.nombre,
      });
      if (citaId) {
        await actualizarDoc("citas", citaId, { estado: "atendida" });
      }
      onSaved();
    } catch (err) {
      setError(err.message);
    }
    setGuardando(false);
  }

  return (
    <Modal title={`Nueva consulta — ${paciente.nombre}`} onClose={onClose} wide>
      <form onSubmit={guardar}>
        <div className="grid sm:grid-cols-2 gap-x-4">
          <Field label="Fecha"><TextInput type="date" required value={data.fecha} onChange={set("fecha")} /></Field>
          <Field label="Hora"><TextInput type="time" value={data.hora} onChange={set("hora")} /></Field>
        </div>
        <Field label="Motivo de consulta"><TextArea rows={2} required value={data.motivoConsulta} onChange={set("motivoConsulta")} /></Field>
        <Field label="Síntomas / anamnesis"><TextArea rows={2} value={data.sintomas} onChange={set("sintomas")} /></Field>

        <div className="mt-2 mb-1 text-xs font-semibold uppercase tracking-wider text-muted">Signos vitales</div>
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-x-4">
          <Field label="Presión arterial"><TextInput value={data.presionArterial} onChange={set("presionArterial")} placeholder="120/80" /></Field>
          <Field label="Frec. cardíaca (lpm)"><TextInput type="number" value={data.frecuenciaCardiaca} onChange={set("frecuenciaCardiaca")} /></Field>
          <Field label="Frec. respiratoria (rpm)"><TextInput type="number" value={data.frecuenciaRespiratoria} onChange={set("frecuenciaRespiratoria")} /></Field>
          <Field label="Temperatura (°C)"><TextInput type="number" step="0.1" value={data.temperatura} onChange={set("temperatura")} /></Field>
          <Field label="Sat. O₂ (%)"><TextInput type="number" value={data.saturacionO2} onChange={set("saturacionO2")} /></Field>
          <Field label="Peso (kg)"><TextInput type="number" step="0.1" value={data.peso} onChange={set("peso")} /></Field>
          <Field label="Talla (cm)"><TextInput type="number" value={data.talla} onChange={set("talla")} /></Field>
          <Field label="IMC">
            <div className={`${inputClass} flex items-center bg-line/40 dark:bg-white/10`}>
              {imc != null ? `${imc} · ${claseIMC(imc)}` : "—"}
            </div>
          </Field>
        </div>

        <Field label="Examen físico"><TextArea rows={2} value={data.examenFisico} onChange={set("examenFisico")} /></Field>
        <Field label="Diagnóstico"><TextArea rows={2} value={data.diagnostico} onChange={set("diagnostico")} /></Field>
        <Field label="Plan / tratamiento"><TextArea rows={2} value={data.plan} onChange={set("plan")} /></Field>
        <Field label="Indicaciones para el paciente"><TextArea rows={2} value={data.indicaciones} onChange={set("indicaciones")} /></Field>
        <Field label="Próximo control (opcional)"><TextInput type="date" value={data.proximoControl} onChange={set("proximoControl")} /></Field>

        {error && <p className="text-warn text-sm mb-3">{error}</p>}
        <div className="flex gap-2 justify-end mt-2">
          <SecondaryButton onClick={onClose}>Cancelar</SecondaryButton>
          <PrimaryButton type="submit" disabled={guardando}>{guardando ? "Guardando…" : "Guardar consulta"}</PrimaryButton>
        </div>
      </form>
    </Modal>
  );
}

// -----------------------------------------------------------------------
// Recetas: uno o más medicamentos por receta, con dosis/vía/frecuencia/
// duración. Se puede imprimir o compartir como texto (WhatsApp, correo…).
// -----------------------------------------------------------------------
function medicamentoVacio() {
  return { nombre: "", dosis: "", via: "Oral", frecuencia: "", duracion: "", indicaciones: "" };
}

function RecetaForm({ paciente, onClose, onSaved }) {
  const [fecha, setFecha] = React.useState(hoyISO());
  const [diagnostico, setDiagnostico] = React.useState("");
  const [notas, setNotas] = React.useState("");
  const [medicamentos, setMedicamentos] = React.useState([medicamentoVacio()]);
  const [guardando, setGuardando] = React.useState(false);
  const [error, setError] = React.useState("");

  function set(i, campo, valor) {
    setMedicamentos((ms) => ms.map((m, idx) => (idx === i ? { ...m, [campo]: valor } : m)));
  }

  async function guardar(e) {
    e.preventDefault();
    const validos = medicamentos.filter((m) => m.nombre.trim());
    if (validos.length === 0) {
      setError("Agrega al menos un medicamento.");
      return;
    }
    setGuardando(true);
    setError("");
    try {
      await crearDoc("recetas", {
        patientId: paciente.id,
        patientName: paciente.nombre,
        fecha,
        diagnostico,
        notas,
        medicamentos: validos,
      });
      onSaved();
    } catch (err) {
      setError(err.message);
    }
    setGuardando(false);
  }

  return (
    <Modal title={`Nueva receta — ${paciente.nombre}`} onClose={onClose} wide>
      <form onSubmit={guardar}>
        <div className="grid sm:grid-cols-2 gap-x-4">
          <Field label="Fecha"><TextInput type="date" required value={fecha} onChange={(e) => setFecha(e.target.value)} /></Field>
          <Field label="Diagnóstico"><TextInput value={diagnostico} onChange={(e) => setDiagnostico(e.target.value)} /></Field>
        </div>

        <div className="mt-2 mb-2 text-xs font-semibold uppercase tracking-wider text-muted">Medicamentos</div>
        <div className="space-y-3">
          {medicamentos.map((m, i) => (
            <div key={i} className="border border-line dark:border-white/10 rounded-lg p-3 relative">
              {medicamentos.length > 1 && (
                <button type="button" onClick={() => setMedicamentos((ms) => ms.filter((_, idx) => idx !== i))} className="absolute top-2 right-2 text-faint hover:text-warn text-sm">✕</button>
              )}
              <div className="grid sm:grid-cols-2 gap-x-4">
                <Field label="Medicamento"><TextInput value={m.nombre} onChange={(e) => set(i, "nombre", e.target.value)} /></Field>
                <Field label="Dosis"><TextInput value={m.dosis} onChange={(e) => set(i, "dosis", e.target.value)} placeholder="Ej. 500 mg" /></Field>
                <Field label="Vía">
                  <Select value={m.via} onChange={(e) => set(i, "via", e.target.value)}>
                    {VIAS_ADMINISTRACION.map((v) => <option key={v}>{v}</option>)}
                  </Select>
                </Field>
                <Field label="Frecuencia"><TextInput value={m.frecuencia} onChange={(e) => set(i, "frecuencia", e.target.value)} placeholder="Ej. cada 8 horas" /></Field>
                <Field label="Duración"><TextInput value={m.duracion} onChange={(e) => set(i, "duracion", e.target.value)} placeholder="Ej. 7 días" /></Field>
              </div>
              <Field label="Indicaciones específicas"><TextInput value={m.indicaciones} onChange={(e) => set(i, "indicaciones", e.target.value)} placeholder="Ej. Tomar con alimentos" /></Field>
            </div>
          ))}
        </div>
        <button type="button" onClick={() => setMedicamentos((ms) => [...ms, medicamentoVacio()])} className="text-sm text-accent2 hover:underline mt-2">+ Agregar otro medicamento</button>

        <Field label="Notas adicionales"><TextArea rows={2} value={notas} onChange={(e) => setNotas(e.target.value)} /></Field>

        {error && <p className="text-warn text-sm mb-3">{error}</p>}
        <div className="flex gap-2 justify-end mt-3">
          <SecondaryButton onClick={onClose}>Cancelar</SecondaryButton>
          <PrimaryButton type="submit" disabled={guardando}>{guardando ? "Guardando…" : "Guardar receta"}</PrimaryButton>
        </div>
      </form>
    </Modal>
  );
}

function construirTextoReceta(r, config) {
  const lineas = [];
  lineas.push(config.nombreConsultorio || "Consultorio médico");
  if (config.nombreMedico) lineas.push(config.nombreMedico + (config.especialidad ? ` · ${config.especialidad}` : ""));
  lineas.push("");
  lineas.push(`Paciente: ${r.patientName}`);
  lineas.push(`Fecha: ${formatFecha(r.fecha)}`);
  if (r.diagnostico) lineas.push(`Diagnóstico: ${r.diagnostico}`);
  lineas.push("");
  lineas.push("RECETA:");
  r.medicamentos.forEach((m, i) => {
    lineas.push(`${i + 1}. ${m.nombre} — ${m.dosis} — ${m.via} — ${m.frecuencia} — ${m.duracion}`);
    if (m.indicaciones) lineas.push(`   ${m.indicaciones}`);
  });
  if (r.notas) {
    lineas.push("");
    lineas.push(`Notas: ${r.notas}`);
  }
  return lineas.join("\n");
}

function compartirReceta(r, config) {
  const texto = construirTextoReceta(r, config);
  if (navigator.share) {
    navigator.share({ title: `Receta — ${r.patientName}`, text: texto }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(texto).then(
      () => alert("Receta copiada. Puedes pegarla en WhatsApp, correo o donde prefieras enviarla."),
      () => alert(texto)
    );
  } else {
    alert(texto);
  }
}

function imprimirReceta(r, config) {
  const win = window.open("", "_blank");
  const filas = r.medicamentos
    .map(
      (m, i) => `
    <tr>
      <td style="padding:6px;border-bottom:1px solid #eee">${i + 1}</td>
      <td style="padding:6px;border-bottom:1px solid #eee"><strong>${esc(m.nombre)}</strong>${m.indicaciones ? `<br><span style="color:#666;font-size:12px">${esc(m.indicaciones)}</span>` : ""}</td>
      <td style="padding:6px;border-bottom:1px solid #eee">${esc(m.dosis)}</td>
      <td style="padding:6px;border-bottom:1px solid #eee">${esc(m.via)}</td>
      <td style="padding:6px;border-bottom:1px solid #eee">${esc(m.frecuencia)}</td>
      <td style="padding:6px;border-bottom:1px solid #eee">${esc(m.duracion)}</td>
    </tr>`
    )
    .join("");
  win.document.write(`
    <html><head><title>Receta - ${esc(r.patientName)}</title>
    <style>body{font-family:Arial,sans-serif;padding:24px;color:#1F3A5F;max-width:720px;margin:0 auto}
    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
    th{text-align:left;padding:6px;border-bottom:2px solid #1F3A5F;font-size:12px;text-transform:uppercase;color:#666}</style>
    </head><body>
      <h1>${esc(config.nombreConsultorio || "Consultorio médico")}</h1>
      <p style="color:#666">${esc(config.nombreMedico || "")} ${config.especialidad ? "· " + esc(config.especialidad) : ""}</p>
      <hr>
      <p><strong>Paciente:</strong> ${esc(r.patientName)} &nbsp;&nbsp; <strong>Fecha:</strong> ${esc(formatFecha(r.fecha))}</p>
      ${r.diagnostico ? `<p><strong>Diagnóstico:</strong> ${esc(r.diagnostico)}</p>` : ""}
      <h2>Receta</h2>
      <table><thead><tr><th>#</th><th>Medicamento</th><th>Dosis</th><th>Vía</th><th>Frecuencia</th><th>Duración</th></tr></thead>
      <tbody>${filas}</tbody></table>
      ${r.notas ? `<p style="margin-top:16px"><strong>Notas:</strong> ${esc(r.notas)}</p>` : ""}
      <div style="margin-top:60px;text-align:center;border-top:1px solid #333;width:260px;padding-top:6px;font-size:12px;color:#666">Firma y sello</div>
    </body></html>
  `);
  win.document.close();
  win.print();
}

function TarjetaReceta({ r, config }) {
  return (
    <Card>
      <div className="flex items-start justify-between gap-2 flex-wrap">

function ExamenForm({ paciente, onClose, onSaved }) {
  const [data, setData] = React.useState({
    fecha: hoyISO(),
    tipo: TIPOS_EXAMEN[0],
    nombreExamen: "",
    resultado: "",
    archivoUrl: "",
    notas: "",
  });
  const [subiendo, setSubiendo] = React.useState(false);
  const [guardando, setGuardando] = React.useState(false);
  const [error, setError] = React.useState("");
  const set = (k) => (e) => setData((d) => ({ ...d, [k]: e.target.value }));

  async function subirArchivo(e) {
    const file = e.target.files[0];
    if (!file) return;
    setSubiendo(true);
    try {
      const url = await subirACloudinary(file, `${carpetaPaciente(paciente.id, paciente.nombre)}/examenes`);
      setData((d) => ({ ...d, archivoUrl: url }));
    } catch (err) {
      setError(err.message);
    }
    setSubiendo(false);
  }

  async function guardar(e) {
    e.preventDefault();
    if (!data.nombreExamen.trim()) {
      setError("El nombre del examen es obligatorio.");
      return;
    }
    setGuardando(true);
    setError("");
    try {
      await crearDoc("examenes", { ...data, patientId: paciente.id, patientName: paciente.nombre });
      onSaved();
    } catch (err) {
      setError(err.message);
    }
    setGuardando(false);
  }

  return (
    <Modal title={`Nuevo examen — ${paciente.nombre}`} onClose={onClose} wide>
      <form onSubmit={guardar}>
        <div className="grid sm:grid-cols-2 gap-x-4">
          <Field label="Fecha"><TextInput type="date" required value={data.fecha} onChange={set("fecha")} /></Field>
          <Field label="Tipo">
            <Select value={data.tipo} onChange={set("tipo")}>
              {TIPOS_EXAMEN.map((t) => <option key={t}>{t}</option>)}
            </Select>
          </Field>
        </div>
        <Field label="Nombre del examen"><TextInput required value={data.nombreExamen} onChange={set("nombreExamen")} placeholder="Ej. Hemograma completo" /></Field>
        <Field label="Resultado"><TextArea rows={3} value={data.resultado} onChange={set("resultado")} /></Field>
        <Field label="Archivo adjunto (PDF o foto)">
          <div className="flex items-center gap-3">
            {data.archivoUrl && (
              <a href={data.archivoUrl} target="_blank" rel="noreferrer" className="text-sm text-accent2 hover:underline">Ver archivo actual</a>
            )}
            <label className="text-sm text-accent2 cursor-pointer hover:underline">
              {subiendo ? "Subiendo…" : data.archivoUrl ? "Cambiar archivo" : "Adjuntar archivo"}
              <input type="file" accept="image/*,.pdf" className="hidden" onChange={subirArchivo} disabled={subiendo || !cloudinaryReady} />
            </label>
          </div>
          {!cloudinaryReady && <span className="text-xs text-faint block mt-1">(configura Cloudinary para poder adjuntar archivos)</span>}
        </Field>
        <Field label="Notas"><TextArea rows={2} value={data.notas} onChange={set("notas")} /></Field>

        {error && <p className="text-warn text-sm mb-3">{error}</p>}
        <div className="flex gap-2 justify-end mt-2">
          <SecondaryButton onClick={onClose}>Cancelar</SecondaryButton>
          <PrimaryButton type="submit" disabled={guardando}>{guardando ? "Guardando…" : "Guardar examen"}</PrimaryButton>
        </div>
      </form>
    </Modal>
  );
}

// -----------------------------------------------------------------------
// Agenda: calendario mensual con las citas programadas. Al tocar un día
// se puede agendar una cita nueva o revisar/editar las que ya existen.
// -----------------------------------------------------------------------
const DIAS_SEMANA = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

function diasDelMes(anio, mes) {
  const primerDia = new Date(anio, mes, 1);
  const ultimoDia = new Date(anio, mes + 1, 0);
  const inicioSemana = (primerDia.getDay() + 6) % 7; // lunes=0
  const celdas = [];
  for (let i = 0; i < inicioSemana; i++) celdas.push(null);
  for (let d = 1; d <= ultimoDia.getDate(); d++) celdas.push(d);
  return celdas;
}

function isoDeCelda(anio, mes, dia) {
  return `${anio}-${String(mes + 1).padStart(2, "0")}-${String(dia).padStart(2, "0")}`;
}

function tipoCitaInfo(key) {
  return TIPOS_CITA.find((t) => t.key === key) || TIPOS_CITA[TIPOS_CITA.length - 1];
}
function estadoCitaInfo(key) {
  return ESTADOS_CITA.find((e) => e.key === key) || ESTADOS_CITA[0];
}

function CitaForm({ fechaInicial, cita, onClose, onSaved }) {
  const { items: pacientes } = useCollection("pacientes", { orderByField: "nombre" });
  const [data, setData] = React.useState(
    cita || {
      patientId: "",
      fecha: fechaInicial || hoyISO(),
      hora: "09:00",
      tipo: "primera_vez",
      estado: "pendiente",
      notas: "",
    }
  );
  const [guardando, setGuardando] = React.useState(false);
  const [error, setError] = React.useState("");
  const set = (k) => (e) => setData((d) => ({ ...d, [k]: e.target.value }));

  async function guardar(e) {
    e.preventDefault();
    if (!data.patientId) {
      setError("Elige un paciente.");
      return;
    }
    setGuardando(true);
    setError("");
    try {
      const paciente = pacientes.find((p) => p.id === data.patientId);
      const payload = { ...data, patientName: paciente ? paciente.nombre : data.patientName };
      if (cita && cita.id) {
        await actualizarDoc("citas", cita.id, payload);
      } else {
        await crearDoc("citas", { ...payload, recordatorioEnviado: false });
      }
      onSaved();
    } catch (err) {
      setError(err.message);
    }
    setGuardando(false);
  }

  async function eliminar() {
    if (!(await pedirConfirmacion("¿Eliminar esta cita?", { textoConfirmar: "Eliminar", peligro: true }))) return;
    setGuardando(true);
    try {
      await borrarDoc("citas", cita.id);
      onSaved();
    } catch (err) {
      setError(err.message);
    }
    setGuardando(false);
  }

  return (
    <Modal title={cita ? "Editar cita" : "Agendar cita"} onClose={onClose}>
      <form onSubmit={guardar}>
        <Field label="Paciente">
          <Select required value={data.patientId} onChange={set("patientId")}>

        </div>
        <div className="grid grid-cols-2 gap-x-4">
          <Field label="Tipo">
            <Select value={data.tipo} onChange={set("tipo")}>
              {TIPOS_CITA.map((t) => <option key={t.key} value={t.key}>{t.label}</option>)}
            </Select>
          </Field>
          <Field label="Estado">
            <Select value={data.estado} onChange={set("estado")}>

function AgendaView() {
  const hoy = new Date();
  const [mesActual, setMesActual] = React.useState(hoy.getMonth());
  const [anioActual, setAnioActual] = React.useState(hoy.getFullYear());
  const [diaSel, setDiaSel] = React.useState(null);
  const [mostrarForm, setMostrarForm] = React.useState(false);
  const [citaEditando, setCitaEditando] = React.useState(null);
  const [consultaDesdeCita, setConsultaDesdeCita] = React.useState(null);

  const { items: citas, loading } = useCollection("citas", { orderByField: "fecha" });
  const { items: pacientes } = useCollection("pacientes");

  const celdas = diasDelMes(anioActual, mesActual);
  const citasPorDia = {};
  citas.forEach((c) => {
    (citasPorDia[c.fecha] = citasPorDia[c.fecha] || []).push(c);
  });

  function cambiarMes(delta) {
    let m = mesActual + delta;
    let a = anioActual;
    if (m < 0) { m = 11; a--; }
    if (m > 11) { m = 0; a++; }
    setMesActual(m);
    setAnioActual(a);
    setDiaSel(null);
  }

  const hoyIso = hoyISO();
  const anioHoy = hoy.getFullYear();
  const aniosDisponibles = Array.from({ length: 9 }, (_, i) => anioHoy - 5 + i);

  return (
    <div>
      <div className="flex items-center justify-between gap-2 mb-5 flex-wrap">
        <h1 className="text-2xl font-display font-semibold">Agenda</h1>
        <div className="flex items-center gap-1">
          <button onClick={() => cambiarMes(-1)} className="px-2 py-1 rounded hover:bg-line dark:hover:bg-white/10">‹</button>
          <select
            value={mesActual}
            onChange={(e) => { setMesActual(Number(e.target.value)); setDiaSel(null); }}
            className="text-sm font-medium bg-transparent border border-line dark:border-white/15 rounded-md px-2 py-1.5"
          >
            {MESES.map((m, i) => <option key={m} value={i}>{m}</option>)}
          </select>
          <select
            value={anioActual}
            onChange={(e) => { setAnioActual(Number(e.target.value)); setDiaSel(null); }}
            className="text-sm font-medium bg-transparent border border-line dark:border-white/15 rounded-md px-2 py-1.5"
          >
            {aniosDisponibles.map((a) => <option key={a} value={a}>{a}</option>)}
          </select>
          <button onClick={() => cambiarMes(1)} className="px-2 py-1 rounded hover:bg-line dark:hover:bg-white/10">›</button>
        </div>
      </div>

      {loading ? (
        <Spinner />
      ) : (
        <>
          <div className="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-muted mb-1">
            {DIAS_SEMANA.map((d) => <div key={d}>{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {celdas.map((dia, i) => {
              if (dia == null) return <div key={i} />;
              const iso = isoDeCelda(anioActual, mesActual, dia);
              const citasDia = citasPorDia[iso] || [];
              const esHoy = iso === hoyIso;
              const esSel = iso === diaSel;
              return (
                <button
                  key={i}
                  onClick={() => setDiaSel(iso)}
                  className={`aspect-square rounded-lg border text-sm p-1 flex flex-col items-center justify-start gap-0.5 transition ${
                    esSel ? "border-ink dark:border-accent bg-ink/5 dark:bg-accent/10" : "border-line dark:border-white/10 hover:border-accent"
                  }`}
                >
                  <span className={`text-xs ${esHoy ? "w-5 h-5 rounded-full bg-ink text-paper dark:bg-accent dark:text-ink flex items-center justify-center" : ""}`}>{dia}</span>
                  {citasDia.length > 0 && (
                    <span className="flex gap-0.5 flex-wrap justify-center">
                      {citasDia.slice(0, 3).map((c) => (
                        <span key={c.id} className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: tipoCitaInfo(c.tipo).color }} />
                      ))}
                    </span>
                  )}
                </button>
              );
            })}
          </div>

          {diaSel && (
            <PanelDia
              fecha={diaSel}
              citas={citasPorDia[diaSel] || []}
              onCerrar={() => setDiaSel(null)}
              onNuevaCita={() => setMostrarForm(true)}
              onEditarCita={(c) => setCitaEditando(c)}
              onIniciarConsulta={(c) => setConsultaDesdeCita(c)}
            />
          )}
        </>
      )}

      {mostrarForm && <CitaForm fechaInicial={diaSel} onClose={() => setMostrarForm(false)} onSaved={() => setMostrarForm(false)} />}
      {citaEditando && <CitaForm cita={citaEditando} onClose={() => setCitaEditando(null)} onSaved={() => setCitaEditando(null)} />}
      {consultaDesdeCita && (
        <ConsultaForm
          paciente={pacientes.find((p) => p.id === consultaDesdeCita.patientId) || { id: consultaDesdeCita.patientId, nombre: consultaDesdeCita.patientName }}
          citaId={consultaDesdeCita.id}
          onClose={() => setConsultaDesdeCita(null)}
          onSaved={() => setConsultaDesdeCita(null)}
        />
      )}
    </div>
  );
}

async function activarNotificaciones() {
  if (!messaging) throw new Error("Este navegador no soporta notificaciones push, o Firebase no está configurado.");
  if (VAPID_KEY === "PENDIENTE_DE_CONFIGURAR") throw new Error("Falta configurar la clave VAPID en el código (VAPID_KEY).");
  const permiso = await Notification.requestPermission();
  if (permiso !== "granted") throw new Error("No se concedió permiso para notificaciones.");
  const reg = await navigator.serviceWorker.ready;
  const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
  if (!token) throw new Error("No se pudo obtener el token de notificaciones.");
  await withTimeout(
    db.collection("users").doc(window.__dataOwnerUid).collection("data").doc("config").set(
      { fcmTokens: firebase.firestore.FieldValue.arrayUnion(token) },
      { merge: true }
    )
  );
  localStorage.setItem(CLAVE_PREFERENCIA_NOTIF, "1");
}

function ColaboradoresLista() {
  const [colaboradores, setColaboradores] = React.useState([]);
  const [loading, setLoading] = React.useState(true);

  React.useEffect(() => {
    if (!window.__dataOwnerUid) return;
    const unsub = db
      .collection("users")
      .doc(window.__dataOwnerUid)
      .collection("colaboradores")
      .onSnapshot((snap) => {
        setColaboradores(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        setLoading(false);
      });
    return () => unsub();
  }, [window.__dataOwnerUid]);

  async function alternarSeccion(colabId, secciones, key) {
    const nuevas = secciones.includes(key) ? secciones.filter((s) => s !== key) : [...secciones, key];
    await withTimeout(
      db.collection("users").doc(window.__dataOwnerUid).collection("colaboradores").doc(colabId).set(
        { secciones: nuevas },
        { merge: true }
      )
    );
  }

  async function quitarColaborador(colabId) {
    if (!(await pedirConfirmacion("¿Quitar a esta persona del equipo? Ya no podrá ver los datos del consultorio.", { textoConfirmar: "Quitar", peligro: true }))) return;
    await withTimeout(db.collection("users").doc(window.__dataOwnerUid).collection("colaboradores").doc(colabId).delete());
  }

  if (loading) return <Spinner />;
  if (colaboradores.length === 0) return <p className="text-sm text-faint mt-4">Todavía nadie se ha unido con este código.</p>;

  return (
    <div className="mt-4 space-y-2">
      {colaboradores.map((c) => (
        <div key={c.id} className="border border-line dark:border-white/10 rounded-lg p-3">
          <div className="flex items-center justify-between">
            <div>
              <div className="font-medium text-sm">{c.nombre}</div>
              <div className="text-xs text-muted">{c.email}</div>
            </div>
            <DangerLink onClick={() => quitarColaborador(c.id)}>Quitar</DangerLink>
          </div>
          <div className="flex gap-1.5 flex-wrap mt-2">
            {TODAS_LAS_SECCIONES.filter((s) => s.key !== "config").map((s) => {
              const activo = (c.secciones || []).includes(s.key);
              return (
                <button
                  key={s.key}
                  onClick={() => alternarSeccion(c.id, c.secciones || [], s.key)}
                  className={`text-xs px-2.5 py-1 rounded-full border transition ${
                    activo ? "bg-ink text-paper border-ink dark:bg-accent dark:text-ink dark:border-accent" : "border-line text-muted dark:border-white/15"
                  }`}
                >
                  {s.label}
                </button>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

// Panel de administración: solo lo ve quien inició sesión con
// ADMIN_EMAIL. Lista todos los consultorios registrados en MedicData
// (no los datos clínicos de cada uno, solo lo básico) y permite
// bloquear/desbloquear el acceso de una cuenta.
