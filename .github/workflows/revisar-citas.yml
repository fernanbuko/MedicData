name: Revisar citas próximas y enviar notificaciones

on:
  schedule:
    # Cada 30 minutos. Este disparador de GitHub es "mejor esfuerzo": en
    # repos nuevos o con poca actividad puede atrasarse varias horas, o
    # saltarse corridas. Se deja como respaldo, pero el disparador
    # confiable es "repository_dispatch" de aquí abajo, activado por un
    # cron externo (cron-job.org) que llama a la API de GitHub cada 30
    # minutos — ver el README para configurarlo.
    - cron: "*/30 * * * *"
  repository_dispatch:
    types: [revisar-citas]
  workflow_dispatch: {} # permite ejecutarlo a mano desde la pestaña Actions, para probar

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install firebase-admin
        working-directory: notificaciones-robot

      - name: Ejecutar la revisión de citas
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node revisar-citas.js
        working-directory: notificaciones-robot
