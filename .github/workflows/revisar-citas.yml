name: Revisar citas próximas y enviar notificaciones

on:
  schedule:
    # Cada 30 minutos. GitHub Actions usa hora UTC, pero esto no afecta el
    # resultado: el script calcula "cuánto falta para la cita" comparando
    # fechas completas, no solo la hora del reloj del robot. Como la
    # ventana de aviso (MINUTOS_VENTANA en revisar-citas.js) también es de
    # 30 minutos, cada cita sigue quedando cubierta por alguna corrida.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite ejecutarlo a mano desde la pestaña Actions, para probar

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install firebase-admin
        working-directory: notificaciones-robot

      - name: Ejecutar la revisión de citas
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node revisar-citas.js
        working-directory: notificaciones-robot
